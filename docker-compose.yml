version: '3.8'

services:
  # Main development environment
  odyssey-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: odyssey-android-dev
    hostname: odyssey-dev
    working_dir: /workspace/OdysseyDecomp
    volumes:
      - .:/workspace/OdysseyDecomp:cached
      - ~/.gradle:/root/.gradle:cached
      - ~/.cache/bazel:/root/.cache/bazel:cached
      - ccache-volume:/workspace/.ccache:cached
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - ANDROID_NDK_HOME=/opt/android-ndk
      - ANDROID_NDK_ROOT=/opt/android-ndk
      - VULKAN_SDK=/usr
      - ANDROID_SDK_ROOT=/opt/android-sdk
      - ANDROID_SDK_ROOT=/opt/android-sdk
      - ANDROID_SDK_HOME=/opt/android-sdk
      - ANDROID_HOME=/opt/android-sdk
      - ANDROID_NDK_HOME=/opt/android-ndk
      - VULKAN_SDK=/usr
      - DISPLAY=${DISPLAY:-:0}
    # Run as current user to avoid permission issues
    user: "${UID:-1000}:${GID:-1000}"
    # Keep container running
    tty: true
    stdin_open: true
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 16G
          cpus: '4'
        reservations:
          memory: 4G
          cpus: '2'
    networks:
      - odyssey-network
    # Health check
    healthcheck:
      test: ["CMD", "bash", "-c", "which cmake && which ninja && which clang && which cargo && which adb && echo OK"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Build service - for CI/CD
  odyssey-build:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: odyssey-android-build
    working_dir: /workspace/OdysseyDecomp
    volumes:
      - .:/workspace/OdysseyDecomp:cached
      - ccache-volume:/workspace/.ccache:cached
    environment:
      - ANDROID_NDK_HOME=/opt/android-ndk
      - VULKAN_SDK=/opt/vulkan-sdk/1.3.296.0/x86_64
    command: ["bash", "-c", "tools/build.py --clean && tools/check"]
    depends_on:
      - odyssey-dev
    networks:
      - odyssey-network

  # Android emulator for testing
  android-emulator:
    image: budtmo/docker-android:emulator_34.0
    container_name: odyssey-android-emulator
    privileged: true
    devices:
      - /dev/kvm:/dev/kvm
    ports:
      - "5554:5554"
      - "5555:5555"
      - "6080:6080"
    environment:
      - DEVICE=Samsung Galaxy S23
      - ANDROID_VERSION=34
      - ARCH=arm64
      - RAM_SIZE=4096M
      - DPI=420
      - SKIN=pixel_7_pro
    volumes:
      - emulator-data:/data
    networks:
      - odyssey-network
    healthcheck:
      test: ["CMD", "adb", "devices"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Vulkan validation layer testing
  vulkan-validation:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: odyssey-vulkan-validation
    working_dir: /workspace/OdysseyDecomp
    volumes:
      - .:/workspace/OdysseyDecomp:cached
      - ccache-volume:/workspace/.ccache:cached
    environment:
      - VK_LAYER_PATH=/opt/vulkan-sdk/1.3.296.0/x86_64/etc/vulkan/explicit_layer.d
      - VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation
    command: ["bash", "-c", "tools/build.py --verbose 2>&1 | tee build.log"]
    depends_on:
      - odyssey-dev
    networks:
      - odyssey-network

volumes:
  ccache-volume:
    driver: local
  emulator-data:
    driver: local

networks:
  odyssey-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16